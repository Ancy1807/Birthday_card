<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Aristo 🎉</title>

<style>
body {
    background: linear-gradient(to bottom right, #ffd6e8, #fff5cc);
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    padding-top: 40px;
}

h1 {
    color: #ff4f81;
    font-size: 3em;
}

p {
    font-size: 1.2em;
    color: #444;
}

.cake {
    position: relative;
    margin: 60px auto;
    width: 260px;
    height: 160px;
    background: pink;
    border-radius: 10px;
    box-shadow: 0 8px 0 #e68ab0;
}

.cake::before {
    content: "";
    position: absolute;
    top: -30px;
    left: 0;
    width: 260px;
    height: 30px;
    background: #ffb6c1;
    border-radius: 10px 10px 0 0;
}

.candle {
    position: absolute;
    bottom: 160px;
    width: 12px;
    height: 40px;
    background: #fff;
    border-radius: 4px;
}

.flame {
    width: 12px;
    height: 16px;
    background: orange;
    border-radius: 50%;
    margin-top: -18px;
    animation: flicker 0.2s infinite;
}

@keyframes flicker {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
}

.wish {
    display: none;
    font-size: 1.4em;
    color: #2c7a7b;
    margin-top: 30px;
}

.from {
    margin-top: 40px;
    font-size: 1.1em;
    color: #555;
    font-style: italic;
}

button {
    padding: 12px 24px;
    border: none;
    background: #ff4f81;
    color: white;
    border-radius: 25px;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>🎉 Happy Birthday Aristo 🎉</h1>
<p>Blow into your mic to blow out the candles 🎂💨</p>

<button onclick="startMic()">Enable Microphone 🎤</button>

<div class="cake">
    <div class="candle" style="left:60px"><div class="flame"></div></div>
    <div class="candle" style="left:120px"><div class="flame"></div></div>
    <div class="candle" style="left:180px"><div class="flame"></div></div>
</div>

<div class="wish" id="wish">
✨ Wish made, Aristo! ✨  
<br>May this year bring you happiness and peace 💫
</div>

<div class="from">— From Ancy 💕</div>

<script>
let audioContext;
let analyser;
let micStream;
let blown = false;

function startMic() {
    navigator.mediaDevices.getUserMedia({ audio: true })
        .then(stream => {
            audioContext = new AudioContext();
            micStream = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            micStream.connect(analyser);
            listenForBlow();
        })
        .catch(() => {
            alert("Microphone access is needed to blow the candles 🎂");
        });
}

function listenForBlow() {
    const data = new Uint8Array(analyser.frequencyBinCount);

    function detect() {
        analyser.getByteFrequencyData(data);
        let volume = data.reduce((a, b) => a + b) / data.length;

        if (volume > 50 && !blown) {   // sensitivity
            blowCandles();
            blown = true;
        }
        requestAnimationFrame(detect);
    }
    detect();
}

function blowCandles() {
    document.querySelectorAll('.flame')
        .forEach(f => f.style.display = 'none');
    document.getElementById('wish').style.display = 'block';
}
</script>

</body>
</html>
