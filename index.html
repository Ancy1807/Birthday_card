<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Aristo</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #020617, #0f172a);
    color: white;
}

/* COVER */
#cover {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0ea5e9, #1e3a8a);
    text-align: center;
    cursor: pointer;
}

#cover h1 {
    font-size: 2.6em;
    letter-spacing: 3px;
    font-weight: 600;
}

/* MAIN */
#main {
    display: none;
    min-height: 100vh;
    padding: 40px 20px;
}

.layout {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 30px;
}

/* LEFT MESSAGE (hidden initially) */
.text {
    flex: 1;
    opacity: 0;
    transform: translateX(-20px);
    transition: all 0.8s ease;
}

.text.show {
    opacity: 1;
    transform: translateX(0);
}

.text h2 {
    font-size: 2em;
    color: #38bdf8;
    font-weight: 600;
}

.text p {
    font-size: 1.2em;
    line-height: 1.6;
    font-weight: 300;
}

/* RIGHT */
.right {
    flex: 1;
    text-align: center;
}

button {
    background: #0ea5e9;
    border: none;
    color: white;
    padding: 12px 22px;
    border-radius: 30px;
    font-size: 1em;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
}

/* CAKE */
.cake {
    margin: 40px auto;
    width: 180px;
    height: 110px;
    background: #38bdf8;
    border-radius: 12px;
    position: relative;
}

.cake::before {
    content: "";
    position: absolute;
    top: -25px;
    width: 180px;
    height: 25px;
    background: #7dd3fc;
    border-radius: 12px 12px 0 0;
}

.candle {
    position: absolute;
    bottom: 110px;
    width: 10px;
    height: 35px;
    background: white;
    border-radius: 3px;
}

.flame {
    width: 10px;
    height: 14px;
    background: orange;
    border-radius: 50%;
    margin-top: -16px;
    animation: flicker 0.2s infinite;
}

@keyframes flicker {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
}

.wish {
    display: none;
    color: #7dd3fc;
    font-size: 1.1em;
    margin-top: 15px;
}

/* MOBILE */
@media (max-width: 768px) {
    .layout {
        flex-direction: column;
        text-align: center;
    }
}
</style>
</head>

<body>

<!-- COVER -->
<div id="cover" onclick="openMain()">
    <h1>HAPPY BIRTHDAY<br>ARISTO</h1>
</div>

<!-- MAIN -->
<div id="main">
    <div class="layout">

        <!-- LEFT (hidden first) -->
        <div class="text" id="leftText">
            <h2>HAPPY BIRTHDAY</h2>
            <p>
                May this year bring you happiness,<br>
                peace, and everything you deserve.
            </p>
        </div>

        <!-- RIGHT -->
        <div class="right">
            <button onclick="startMic()">Enable Microphone 🎤</button>

            <div class="cake">
                <div class="candle" style="left:45px"><div class="flame"></div></div>
                <div class="candle" style="left:85px"><div class="flame"></div></div>
                <div class="candle" style="left:125px"><div class="flame"></div></div>
            </div>

            <div class="wish" id="wish">
                ✨ Wish made, Aristo ✨
            </div>
        </div>

    </div>
</div>

<script>
let analyser, dataArray, blown = false;

function openMain() {
    document.getElementById("cover").style.display = "none";
    document.getElementById("main").style.display = "block";
}

function startMic() {
    navigator.mediaDevices.getUserMedia({ audio: true })
    .then(stream => {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const source = ctx.createMediaStreamSource(stream);
        analyser = ctx.createAnalyser();
        analyser.fftSize = 1024;
        dataArray = new Uint8Array(analyser.fftSize);
        source.connect(analyser);
        detectBlow();
    })
    .catch(() => alert("Please allow microphone access 🎤"));
}

function detectBlow() {
    analyser.getByteTimeDomainData(dataArray);
    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) {
        let v = (dataArray[i] - 128) / 128;
        sum += v * v;
    }
    let volume = Math.sqrt(sum / dataArray.length);

    if (volume > 0.15 && !blown) {
        document.querySelectorAll(".flame").forEach(f => f.style.display = "none");
        document.getElementById("wish").style.display = "block";
        document.getElementById("leftText").classList.add("show");
        blown = true;
    }
    requestAnimationFrame(detectBlow);
}
</script>

</body>
</html>
